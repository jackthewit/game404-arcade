  <link id="g404-arcade-fonts" rel="stylesheet" href="./assets/fonts/arcade-fonts.css">
  <style>
    :root {
      --tray-stone: #D8DDE4;
      --tray-well: #C6CDD6;
      --tray-mid: #AEB7C3;
      --label-paper: #F5F7FA;
      --label-tint: #E9EDF2;
      --ink: #15171A;
      --ink-panel: #23272E;
      --ink-secondary: #373D45;
      --ink-on-dark: #F5F7FA;
      --muted-on-dark: #CBD2DC;
      --stamp-red: #C92A1D;
      --stamp-red-hover: #B32216;
      --serial-blue: #163ECA;
      --plate-yellow: #F2BE18;
      --rule-light: #C6CDD6;
      --rule-dark: #373D45;
      --font-display: 'Do Hyeon', 'Apple SD Gothic Neo', sans-serif;
      --font-serial: 'Chakra Petch', 'Pretendard', sans-serif;
      --font-body: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      --ease-snap: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: var(--plate-yellow);
      color: var(--ink);
    }

    html {
      background: var(--tray-stone);
      color: var(--ink);
      scrollbar-color: #23272E #C6CDD6;
      scrollbar-width: thin;
      caret-color: var(--stamp-red);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #C6CDD6;
    }
    ::-webkit-scrollbar-thumb {
      background: #23272E;
      border: 2px solid #C6CDD6;
      border-radius: 2px;
    }

    body {
      min-height: 100vh;
      background-color: var(--tray-stone);
      background-image: radial-gradient(rgba(21, 23, 26, 0.05) 1px, transparent 0);
      background-size: 16px 16px;
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a, button {
      font-family: inherit;
      text-underline-offset: 4px;
    }

    :focus-visible {
      outline: 2.5px solid var(--serial-blue);
      outline-offset: 2px;
    }

    .tray-shell {
      max-width: 1360px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top) + 10px) 24px 56px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 1. 상단 명판 도구 바 */
    .tray-nameplate {
      background: var(--label-paper);
      border: 2px solid var(--ink);
      border-radius: 3px;
      padding: 10px 14px;
      box-shadow: 0 8px 20px -10px rgba(21, 23, 26, 0.18);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pack-stamp {
      font-family: var(--font-serial);
      font-weight: 700;
      font-size: 19px;
      letter-spacing: -0.02em;
      background: var(--ink);
      color: var(--plate-yellow);
      padding: 4px 11px;
      border-radius: 2px;
      line-height: 1.1;
    }

    .brand-title-inline {
      font-size: 15.5px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    /* 기계식 5자리 드럼 적산 카운터 */
    .mech-counter {
      display: inline-flex;
      align-items: stretch;
      border: 1.5px solid var(--ink);
      border-radius: 2px;
      background: var(--ink);
      overflow: hidden;
      font-family: var(--font-serial);
      font-variant-numeric: tabular-nums;
    }

    .mech-counter-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      background: var(--label-tint);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      border-right: 1.5px solid var(--ink);
      font-family: var(--font-body);
    }

    .counter-dot {
      width: 6px;
      height: 6px;
      border-radius: 1px;
      background: var(--stamp-red);
      display: inline-block;
    }

    .mech-drums {
      display: inline-flex;
      align-items: stretch;
      background: var(--ink);
    }

    .drum-cell {
      width: 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 0;
      background: var(--ink-panel);
      color: var(--plate-yellow);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.1;
      border-right: 1px solid var(--rule-dark);
    }

    .drum-cell:last-child {
      border-right: none;
    }

    .mech-unit {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      background: var(--ink);
      color: var(--ink-on-dark);
      font-size: 11.5px;
      font-weight: 700;
    }

    .tool-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .keycap-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 3px;
      border: 1.5px solid var(--ink);
      background: var(--label-tint);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.14s var(--ease-snap), background 0.14s ease, color 0.14s ease;
    }

    .keycap-btn:hover {
      background: var(--label-paper);
      transform: translateY(1px);
    }

    .keycap-btn:active {
      transform: translateY(2px);
    }

    .keycap-btn.is-yellow {
      background: var(--plate-yellow);
      color: var(--ink);
    }

    .keycap-btn.is-yellow:hover {
      background: #F6C930;
    }

    .keycap-btn.is-muted {
      background: var(--tray-well);
      color: var(--ink-secondary);
    }

    .keycap-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* 2. 대표 마스터 카트리지 장착 슬롯 */
    .master-well {
      background: var(--tray-well);
      border: 2px solid var(--ink);
      border-radius: 4px;
      padding: 9px;
    }

    .master-cartridge {
      display: grid;
      grid-template-columns: minmax(340px, 1.12fr) 1fr;
      gap: 24px;
      background: var(--ink);
      color: var(--ink-on-dark);
      border: 2px solid var(--ink);
      border-radius: 3px;
      padding: 16px 20px 16px 16px;
      text-decoration: none;
      box-shadow: 0 12px 24px -10px rgba(21, 23, 26, 0.34);
      transition: transform 0.18s var(--ease-snap), box-shadow 0.18s var(--ease-snap), border-color 0.16s ease;
      position: relative;
    }

    .master-cartridge:hover,
    .master-cartridge:focus-visible {
      transform: translateY(3px);
      border-color: var(--plate-yellow);
      box-shadow: 0 5px 10px -4px rgba(21, 23, 26, 0.38);
    }

    .master-cartridge:active {
      transform: translateY(5px) scale(0.996);
    }

    .master-media-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 2px;
      border: 2px solid var(--plate-yellow);
      overflow: hidden;
      background: var(--ink-panel);
      align-self: center;
    }

    .master-media-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.28s var(--ease-snap);
    }

    .master-cartridge:hover .master-media-frame img {
      transform: scale(1.02);
    }

    .master-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
      min-width: 0;
    }

    .master-title-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .master-heading {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(30px, 3.6vw, 46px);
      line-height: 1.06;
      letter-spacing: -0.02em;
      color: var(--ink-on-dark);
      word-break: keep-all;
    }

    .master-stamps {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stamp-master {
      background: var(--stamp-red);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 2px;
      letter-spacing: 0.01em;
    }

    .stamp-spec {
      background: var(--ink-panel);
      color: var(--plate-yellow);
      border: 1px solid var(--rule-dark);
      font-family: var(--font-serial);
      font-size: 13.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 2px;
      font-variant-numeric: tabular-nums;
    }

    .master-copy {
      font-size: 15.5px;
      line-height: 1.56;
      color: var(--muted-on-dark);
      max-width: 64ch;
      word-break: keep-all;
    }

    .master-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid var(--rule-dark);
    }

    .master-record {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 14.5px;
      font-weight: 800;
      color: var(--plate-yellow);
      font-variant-numeric: tabular-nums;
    }

    .master-cta {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: var(--stamp-red);
      color: #FFFFFF;
      border: 2px solid var(--ink-on-dark);
      border-radius: 3px;
      padding: 11px 22px;
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }

    .master-cartridge:hover .master-cta,
    .master-cartridge:focus-visible .master-cta {
      background: var(--plate-yellow);
      color: var(--ink);
      border-color: var(--plate-yellow);
    }

    /* 3. 성형 트레이 4구 카트리지 웰 그리드 */
    .tray-wells-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .cart-well {
      background: var(--tray-well);
      border: 2px solid var(--ink);
      border-radius: 4px;
      padding: 7px;
      display: flex;
      position: relative;
    }

    .cart-pack {
      background: var(--label-paper);
      border: 2px solid var(--ink);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      width: 100%;
      text-decoration: none;
      color: var(--ink);
      box-shadow: 0 10px 18px -8px rgba(21, 23, 26, 0.24);
      transition: transform 0.16s var(--ease-snap), box-shadow 0.16s var(--ease-snap), background 0.14s ease;
    }

    .cart-pack:hover,
    .cart-pack:focus-visible {
      transform: translateY(4px);
      box-shadow: 0 2px 5px -2px rgba(21, 23, 26, 0.3);
    }

    .cart-pack:active {
      transform: translateY(6px) scale(0.994);
      box-shadow: none;
    }

    /* 평면 인쇄 커넥터 인덱스 띠 */
    .cart-pin-strip {
      height: 14px;
      background: var(--label-tint);
      border-bottom: 1.5px solid var(--ink);
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-serial);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink-secondary);
    }

    .pin-marks {
      display: inline-flex;
      gap: 3px;
      align-items: center;
    }

    .pin-marks i {
      display: inline-block;
      width: 5px;
      height: 6px;
      background: var(--tray-mid);
      border: 1px solid var(--ink);
      transition: background 0.14s ease;
    }

    .cart-pack:hover .pin-marks i,
    .cart-pack:focus-visible .pin-marks i {
      background: var(--plate-yellow);
    }

    .cart-cap {
      padding: 5px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-family: var(--font-serial);
      font-size: 12.5px;
      font-weight: 700;
      border-bottom: 1.5px solid var(--ink);
      font-variant-numeric: tabular-nums;
      background: var(--serial-blue);
      color: #FFFFFF;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .cart-pack.is-new .cart-cap {
      background: var(--stamp-red);
      color: #FFFFFF;
    }

    .cart-pack.is-rank .cart-cap {
      background: var(--ink);
      color: var(--plate-yellow);
    }

    .cap-serial-left {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .slot-lamp {
      width: 7px;
      height: 7px;
      border-radius: 1px;
      background: currentColor;
      opacity: 0.55;
      transition: opacity 0.14s ease, background 0.14s ease, transform 0.14s var(--ease-snap);
    }

    .cart-pack:hover .slot-lamp,
    .cart-pack:focus-visible .slot-lamp {
      opacity: 1;
      background: var(--plate-yellow);
      transform: scale(1.25);
    }

    .cart-art {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-bottom: 1.5px solid var(--ink);
      background: var(--ink-panel);
    }

    .cart-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.26s var(--ease-snap);
    }

    .cart-pack:hover .cart-art img {
      transform: scale(1.025);
    }

    .cart-pack.is-locked .cart-art img {
      filter: blur(3px) brightness(0.65);
    }

    .cart-lock-veil {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: rgba(21, 23, 26, 0.54);
    }

    .cart-lock-tag {
      background: var(--plate-yellow);
      color: var(--ink);
      border: 1.5px solid var(--ink);
      padding: 4px 10px;
      border-radius: 2px;
      font-size: 12px;
      font-weight: 900;
    }

    .cart-body {
      padding: 11px 12px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 9px;
      flex: 1;
    }

    .cart-heading {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 22px;
      line-height: 1.14;
      letter-spacing: -0.02em;
      color: var(--ink);
      word-break: keep-all;
    }

    .cart-summary {
      font-size: 13px;
      line-height: 1.44;
      color: var(--ink-secondary);
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
    }

    .cart-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--rule-light);
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .cart-stat-txt {
      color: var(--ink-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cart-go {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 2px;
      border: 1.5px solid var(--ink);
      background: var(--label-tint);
      color: var(--ink);
      font-family: var(--font-serial);
      font-size: 11.5px;
      font-weight: 700;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }

    .cart-pack:hover .cart-go,
    .cart-pack:focus-visible .cart-go {
      background: var(--stamp-red);
      border-color: var(--ink);
      color: #FFFFFF;
    }

    /* 4. 전체 수록 카트리지 도감 (색인 장부) */
    .ledger-section {
      margin-top: 12px;
      background: var(--label-paper);
      border: 2px solid var(--ink);
      border-radius: 4px;
      padding: 22px 22px 18px;
      box-shadow: 0 12px 26px -12px rgba(21, 23, 26, 0.18);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ledger-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--ink);
    }

    .ledger-heading {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .ledger-sub {
      font-size: 13.5px;
      color: var(--ink-secondary);
      font-weight: 600;
      margin-top: 5px;
    }

    .sort-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sort-chip {
      padding: 7px 12px;
      border-radius: 3px;
      border: 1.5px solid var(--ink);
      background: var(--label-tint);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .sort-chip:hover {
      background: var(--label-paper);
    }

    .sort-chip.active {
      background: var(--ink);
      color: var(--plate-yellow);
    }

    .ledger-rows {
      display: flex;
      flex-direction: column;
    }

    .ledger-row {
      display: grid;
      grid-template-columns: 44px 148px minmax(200px, 1.3fr) minmax(210px, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 13px 8px;
      border-bottom: 1px solid var(--rule-light);
      text-decoration: none;
      color: var(--ink);
      border-radius: 2px;
      transition: background 0.14s ease, transform 0.14s var(--ease-snap);
    }

    .ledger-row:last-child {
      border-bottom: none;
    }

    .ledger-row:hover,
    .ledger-row:focus-visible {
      background: var(--label-tint);
      transform: translateX(3px);
    }

    .ledger-num {
      font-family: var(--font-serial);
      font-size: 18px;
      font-weight: 700;
      color: var(--serial-blue);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .ledger-thumb {
      width: 148px;
      aspect-ratio: 16 / 9;
      border-radius: 2px;
      border: 1.5px solid var(--ink);
      overflow: hidden;
      background: var(--ink-panel);
    }

    .ledger-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ledger-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .ledger-title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ledger-title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 21px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .ledger-tag {
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 11.5px;
      font-weight: 800;
      background: var(--tray-stone);
      border: 1px solid var(--tray-mid);
      color: var(--ink);
    }

    .ledger-tag.is-new {
      background: var(--stamp-red);
      border-color: var(--stamp-red);
      color: #FFFFFF;
    }

    .ledger-desc {
      font-size: 13px;
      color: var(--ink-secondary);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
    }

    .ledger-metrics {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12.5px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .ledger-m-primary {
      color: var(--ink);
    }

    .ledger-m-best {
      color: var(--serial-blue);
    }

    .ledger-play-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 15px;
      border-radius: 3px;
      border: 1.5px solid var(--ink);
      background: var(--plate-yellow);
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .ledger-row:hover .ledger-play-btn,
    .ledger-row:focus-visible .ledger-play-btn {
      background: var(--stamp-red);
      border-color: var(--ink);
      color: #FFFFFF;
    }

    /* 5. 응원 티켓 배너 & 푸터 */
    .support-ticket {
      margin-top: 6px;
      background: var(--plate-yellow);
      border: 2px solid var(--ink);
      border-radius: 4px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 10px 22px -12px rgba(21, 23, 26, 0.22);
    }

    .support-copy h2 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 22px;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .support-copy p {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      margin-top: 3px;
    }

    .support-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 3px;
      border: 2px solid var(--ink);
      background: var(--ink);
      color: var(--label-paper);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.14s var(--ease-snap), background 0.14s ease;
    }

    .support-cta:hover {
      background: var(--ink-panel);
      transform: translateY(1px);
    }

    .tray-footer {
      margin-top: 4px;
      padding: 14px 4px 0;
      border-top: 1.5px solid var(--tray-mid);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--ink-secondary);
      font-weight: 700;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .tray-footer a {
      color: var(--ink);
      font-weight: 800;
      text-decoration: underline;
    }

    .tray-footer a:hover {
      color: var(--serial-blue);
    }

    .empty-state-box {
      padding: 36px 20px;
      text-align: center;
      border: 2px dashed var(--ink);
      border-radius: 3px;
      background: var(--label-paper);
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
    }

    /* 토스트 알림 (shared/challenge.js showToast 호환) */
    .toast {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom) + 14px);
      transform: translateX(-50%) translateY(16px);
      z-index: 9800;
      background: var(--ink);
      color: var(--label-paper);
      border: 2px solid var(--plate-yellow);
      border-radius: 3px;
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 800;
      box-shadow: 0 12px 28px rgba(21, 23, 26, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.2s var(--ease-snap);
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 반응형 브레이크포인트 */
    @media (max-width: 1120px) {
      .tray-wells-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .ledger-row {
        grid-template-columns: 38px 128px 1fr auto;
      }
      .ledger-metrics {
        grid-column: 3 / 4;
      }
    }

    @media (max-width: 820px) {
      .tray-shell {
        padding: max(12px, env(safe-area-inset-top) + 8px) 14px 44px;
        gap: 14px;
      }
      .master-cartridge {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 14px;
      }
      .master-cta {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 640px) {
      .tray-wells-grid {
        grid-template-columns: 1fr;
      }
      .ledger-section {
        padding: 16px 14px;
      }
      .ledger-row {
        grid-template-columns: 104px 1fr;
        gap: 10px;
        padding: 12px 4px;
      }
      .ledger-num {
        display: none;
      }
      .ledger-thumb {
        width: 104px;
      }
      .ledger-metrics {
        grid-column: 1 / -1;
        flex-direction: row;
        justify-content: space-between;
        flex-wrap: wrap;
        padding-top: 4px;
      }
      .ledger-play-btn {
        grid-column: 1 / -1;
        justify-content: center;
      }
      .support-cta {
        width: 100%;
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="tray-shell">
    <!-- 1. 상단 명판 및 유틸리티 스위치 바 -->

          <span>응원과 후원</span>

        <a class="keycap-btn" href="https://www.youtube.com/@이게뭔게임404game" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8zM9.6 15.6V8.4L15.8 12l-6.2 3.6z"/></svg>
          <span>유튜브</span>
        </a>
        <a class="keycap-btn" href="https://www.instagram.com/game404notfound/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>

    <main style="display:flex;flex-direction:column;gap:16px;">
      <!-- 2. 대표 마스터 카트리지 데크 -->
      <section id="master-deck" class="master-well" aria-label="대표 마스터 카트리지"></section>

      <!-- 3. 신작 및 인기 카트리지 성형 트레이 -->
      <section id="tray-wells" class="tray-wells-grid" aria-label="신작 및 주요 추천 카트리지"></section>

      <!-- 4. 전체 수록 카트리지 색인 장부 -->
      <section id="catalog-ledger" class="ledger-section" aria-label="전체 수록 카트리지 도감">
        <div class="ledger-header">
          <div>
            <h2 class="ledger-heading" id="ledger-heading-txt">전체 수록 카트리지 도감</h2>
            <p class="ledger-sub">모바일과 PC 브라우저에서 설치 없이 즉시 실행하고 전체 랭킹에 이름을 올리세요.</p>
          </div>
          <div class="sort-tabs" id="sort-tabs" role="group" aria-label="목록 정렬 기준">

            <button type="button" class="sort-chip" data-sort="plays" aria-pressed="false">실행순</button>
            <button type="button" class="sort-chip" data-sort="popular" aria-pressed="false">인기순</button>

      <!-- 5. 제작자 응원 티켓 -->
      <section class="support-ticket" aria-label="제작자 응원 안내">
        <div class="support-copy">
          <h2>404 아케이드 합본팩이 즐거우셨나요?</h2>
          <p>카카오페이 QR 스캔 또는 송금 링크로 다음 실물 미니게임 카트리지 제작을 응원해 주세요.</p>
        </div>
        <button type="button" class="support-cta" id="hub-donate-bottom">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>

    <!-- 6. 하단 명판 푸터 -->
    <footer class="tray-footer">
      <div>모든 수록 게임은 별도 앱 설치 없이 웹 브라우저에서 바로 가동됩니다.</div>
      <div class="footer-links">
        <a href="https://www.youtube.com/@이게뭔게임404game" target="_blank" rel="noopener noreferrer">유튜브 @이게뭔게임404game</a>
        <a href="https://www.instagram.com/game404notfound/" target="_blank" rel="noopener noreferrer">인스타그램 @game404notfound</a>
        <a href="./admin.html">관리자 모드</a>
      </div>
    </footer>
  </div>

  <script type="module">
    import { BGM } from './shared/audio.js';
    import { openCalibrationModal } from './shared/calibration.js';
    import { showToast } from './shared/challenge.js';
    import { DEFAULT_GAMES, fetchPublicCatalog, formatBestText, loadLayoutConfig } from './shared/catalog.js';
    import { computeGamesPopularity, DEFAULT_SOCIAL_STATS } from './shared/popularity.js';
    import { openDonateModal, handleDonateReturnQuery } from './shared/donate.js';

    handleDonateReturnQuery();

    const playIconSvg = `<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3.5 2.2v11.6L13.5 8 3.5 2.2z"/></svg>`;
    const trophyIconSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>`;
    const speakerOnPaths = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>`;
    const speakerOffPaths = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`;

    [document.getElementById('hub-donate-top'), document.getElementById('hub-donate-bottom')].forEach(btn => {
      if (btn) btn.onclick = () => openDonateModal();
    });

    const hubBgm = document.getElementById('hub-bgm');
    const hubBgmIcon = document.getElementById('hub-bgm-icon');
    const hubBgmLabel = document.getElementById('hub-bgm-label');

    function syncHubBgm() {
      if (!hubBgm) return;
      const muted = BGM.isMuted();
      if (hubBgmLabel) hubBgmLabel.textContent = muted ? '배경음 꺼짐' : '배경음 켜짐';
      if (hubBgmIcon) hubBgmIcon.innerHTML = muted ? speakerOffPaths : speakerOnPaths;
      hubBgm.classList.toggle('is-muted', muted);
      hubBgm.setAttribute('aria-pressed', muted ? 'false' : 'true');
    }
    syncHubBgm();
    if (hubBgm) {
      hubBgm.onclick = () => {
        const muted = BGM.toggleMute();
        syncHubBgm();
        showToast(muted ? '모든 게임 배경음이 꺼졌습니다.' : '모든 게임 배경음이 켜졌습니다.');
      };
    }

    const calBtn = document.getElementById('hub-cal');
    if (calBtn) {
      calBtn.onclick = () => openCalibrationModal(() => {
        showToast('실제 1cm 영점 눈금이 저장되었습니다.');
      });
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function stripPictographs(s) {
      return String(s || '')
        .replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, '')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    function formatPlayCount(p) {
      if (p && Number(p.playsTotal) > 0) {
        return `게임 실행 수 ${Math.round(Number(p.playsTotal)).toLocaleString()}회`;
      }
      return '게임 실행 수 집계 중';
    }

    function buildInitialPopMap(games) {
      const m = {};
      for (const g of games) {
        const st = DEFAULT_SOCIAL_STATS[g.id];
        const views = st ? (st.ytViews || 0) + (st.igViews || 0) : 0;
        m[g.id] = {
          playsTotal: 0,
          playsLabel: '게임 실행 수 집계 중',
          socialTotal: views,
          socialLabel: '',
          playSecTotal: 0,
          playTimeLabel: '즉시 가동',
          popularityScore: views,
          topRun: null,
        };
      }
      return m;
    }

    let currentGames = [...DEFAULT_GAMES];
    let popMap = buildInitialPopMap(currentGames);
    let newIdSet = new Set(['snap', 'jjamppong', 'boxcut']);
    let ledgerSort = 'custom';

    function sortByOrder(list) {
      return [...list].sort((a, b) => (a.sort_order ?? 100) - (b.sort_order ?? 100));
    }

    function sortCatalogGames(list) {
      return [...list].sort((a, b) => {
        const lockA = a.status === 'coming_soon' ? 1 : 0;
        const lockB = b.status === 'coming_soon' ? 1 : 0;
        if (lockA !== lockB) return lockA - lockB;

        if (ledgerSort !== 'custom') {
          const pa = popMap[a.id] || { playsTotal: 0, popularityScore: 0, socialTotal: 0, playSecTotal: 0 };
          const pb = popMap[b.id] || { playsTotal: 0, popularityScore: 0, socialTotal: 0, playSecTotal: 0 };
          if (ledgerSort === 'plays' && (pb.playsTotal || 0) !== (pa.playsTotal || 0)) {
            return (pb.playsTotal || 0) - (pa.playsTotal || 0);
          }
          if (ledgerSort === 'popular' && pb.popularityScore !== pa.popularityScore) {
            return pb.popularityScore - pa.popularityScore;
          }
          if (ledgerSort === 'social' && pb.socialTotal !== pa.socialTotal) {
            return pb.socialTotal - pa.socialTotal;
          }
          if (ledgerSort === 'playtime' && pb.playSecTotal !== pa.playSecTotal) {
            return pb.playSecTotal - pa.playSecTotal;
          }
        }
        return (a.sort_order ?? 100) - (b.sort_order ?? 100);
      });
    }

    function bindLockedClicks(root) {
      if (!root) return;
      root.querySelectorAll('a[data-locked="1"]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          showToast(stripPictographs(el.dataset.lockMsg) || '곧 공개 예정인 카트리지입니다.');
        });
      });
    }

    function pickMasterAndTrayGames(visible) {
      const unlocked = visible.filter(g => g.status !== 'coming_soon');
      const pool = unlocked.length > 0 ? unlocked : visible;

      const masterCandidates = pool.filter(g => !newIdSet.has(g.id));
      let masterGame = masterCandidates[0] || pool[0];
      if (masterCandidates.length > 0 && Object.keys(popMap).length > 0) {
        masterGame = [...masterCandidates].sort((a, b) => {
          const sa = (popMap[a.id] && popMap[a.id].popularityScore) || 0;
          const sb = (popMap[b.id] && popMap[b.id].popularityScore) || 0;
          return sb - sa;
        })[0];
      }

      const rest = visible.filter(g => g.id !== masterGame.id);
      const featuredFirst = [
        ...rest.filter(g => newIdSet.has(g.id) || g.featured),
        ...rest.filter(g => !newIdSet.has(g.id) && !g.featured),
      ];
      const trayGames = featuredFirst.slice(0, 4);
      return { masterGame, trayGames };
    }

    function renderDrumCounter(sumPlays) {
      const totalPlaysEl = document.getElementById('hub-total-plays');
      if (!totalPlaysEl) return;
      const digits = String(Math.max(0, Math.round(sumPlays || 0))).padStart(5, '0').split('');
      const drumsHtml = digits.map(d => `<span class="drum-cell">${esc(d)}</span>`).join('');
      totalPlaysEl.setAttribute('aria-label', sumPlays > 0 ? `누적 실행 ${sumPlays.toLocaleString()}회` : '누적 실행 집계 중');
      totalPlaysEl.innerHTML = `
        <span class="mech-counter-label"><span class="counter-dot" aria-hidden="true"></span><span>누적 실행</span></span>
        <span class="mech-drums" aria-hidden="true">${drumsHtml}</span>
        <span class="mech-unit">회</span>
      `;
    }

    function renderGames() {
      const masterDeck = document.getElementById('master-deck');
      const trayWells = document.getElementById('tray-wells');
      const ledgerList = document.getElementById('normal-list');
      const ledgerHeading = document.getElementById('ledger-heading-txt');
      if (!masterDeck || !trayWells || !ledgerList) return;

      const visible = sortByOrder(currentGames).filter(g => g.status !== 'hidden');
      if (visible.length === 0) {
        masterDeck.style.display = 'none';
        trayWells.style.display = 'none';
        ledgerList.innerHTML = `<div class="empty-state-box">새로운 미니게임 카트리지를 준비하고 있습니다. 곧 공개됩니다.</div>`;
        return;
      }

      masterDeck.style.display = 'block';
      trayWells.style.display = 'grid';
      if (ledgerHeading) {
        ledgerHeading.textContent = `전체 수록 카트리지 도감 (${String(visible.length).padStart(2, '0')}종)`;
      }

      const sumPlays = visible.reduce((acc, g) => acc + ((popMap[g.id] && popMap[g.id].playsTotal) || 0), 0);
      renderDrumCounter(sumPlays);

      const { masterGame, trayGames } = pickMasterAndTrayGames(visible);

      // 1) 마스터 카트리지 렌더링
      if (masterGame) {
        const isLocked = masterGame.status === 'coming_soon';
        const lockMsg = masterGame.lock_message || '곧 공개 예정입니다!';
        const href = isLocked ? '#locked' : (masterGame.href || `./${encodeURIComponent(masterGame.id)}/`);
        const pm = popMap[masterGame.id];
        const bestTxt = isLocked ? '공개 대기 중' : stripPictographs(formatBestText(masterGame.id, pm && pm.topRun));
        const statTxt = pm
          ? `${formatPlayCount(pm)} · ${stripPictographs(pm.playTimeLabel)}`
          : '게임 실행 수 집계 중';

        masterDeck.innerHTML = `
          <a class="master-cartridge" id="master-play-cta" href="${esc(href)}" data-game-id="${esc(masterGame.id)}" data-locked="${isLocked ? '1' : '0'}" data-lock-msg="${esc(lockMsg)}">
            <div class="master-media-frame">
              <img src="${esc(masterGame.thumb_url || `./assets/thumb-${masterGame.id}.jpg`)}" alt="${esc(masterGame.title)} 대표 플레이 장면">
            </div>
            <div class="master-info">
              <div class="master-title-block">
                <h1 class="master-heading">${esc(masterGame.title)}</h1>
                <div class="master-stamps">
                  <span class="stamp-master">${newIdSet.has(masterGame.id) ? '신작 마스터팩' : '인기 1위 마스터팩'}</span>
                  <span class="stamp-spec">${esc(statTxt)}</span>
                </div>
              </div>
              <p class="master-copy">${esc(masterGame.description || '')}</p>
              <div class="master-bottom-bar">
                <span class="master-record">${trophyIconSvg}<span>${esc(bestTxt)}</span></span>
                <span class="master-cta">${playIconSvg}<span>${isLocked ? '공개 대기' : '카트리지 실행'}</span></span>
              </div>
            </div>
          </a>
        `;
      }

      // 2) 4구 성형 트레이 렌더링
      let newSeq = 0;
      let rankSeq = 1;
      trayWells.innerHTML = trayGames.map((g, slotIdx) => {
        const isLocked = g.status === 'coming_soon';
        const isNew = newIdSet.has(g.id);
        const lockMsg = g.lock_message || '곧 공개 예정입니다!';
        const href = isLocked ? '#locked' : (g.href || `./${encodeURIComponent(g.id)}/`);
        const p = popMap[g.id];
        const bestTxt = isLocked ? '공개 대기 중' : stripPictographs(formatBestText(g.id, p && p.topRun));

        let serialLeft = 'PACK';
        let variantCls = '';
        if (isNew) {
          newSeq += 1;
          serialLeft = `신작 #0${newSeq}`;
          variantCls = 'is-new';
        } else {
          rankSeq += 1;
          serialLeft = `인기 ${rankSeq}위`;
          variantCls = 'is-rank';
        }

        const serialRight = formatPlayCount(p);
        const subMetric = bestTxt;

        return `
          <div class="cart-well">
            <a class="cart-pack ${variantCls} ${isLocked ? 'is-locked' : ''}" href="${esc(href)}" data-game-id="${esc(g.id)}" data-locked="${isLocked ? '1' : '0'}" data-lock-msg="${esc(lockMsg)}">
              <div class="cart-pin-strip" aria-hidden="true">
                <span>SLOT-0${slotIdx + 1}</span>
                <span class="pin-marks"><i></i><i></i><i></i><i></i><i></i></span>
              </div>
              <div class="cart-cap">
                <span class="cap-serial-left"><span class="slot-lamp" aria-hidden="true"></span><span>${esc(serialLeft)}</span></span>
                <span>${esc(serialRight)}</span>
              </div>
              <div class="cart-art">
                <img src="${esc(g.thumb_url || `./assets/thumb-${g.id}.jpg`)}" alt="${esc(g.title)} 장면">
                ${isLocked ? `<div class="cart-lock-veil"><span class="cart-lock-tag">공개 예정</span></div>` : ''}
              </div>
              <div class="cart-body">
                <div>
                  <h3 class="cart-heading">${esc(g.title)}</h3>
                  <p class="cart-summary">${esc(isLocked ? lockMsg : (g.description || ''))}</p>
                </div>
                <div class="cart-foot">
                  <span class="cart-stat-txt">${esc(subMetric)}</span>
                  <span class="cart-go">${playIconSvg}<span>${isLocked ? '대기' : '실행'}</span></span>
                </div>
              </div>
            </a>
          </div>
        `;
      }).join('');

      // 3) 전체 수록 카트리지 색인 장부 (전체 공개 게임 정렬 비교)
      const sortedAll = sortCatalogGames(visible);
      ledgerList.innerHTML = sortedAll.map((g, idx) => {
        const isLocked = g.status === 'coming_soon';
        const isNew = newIdSet.has(g.id);
        const lockMsg = g.lock_message || '곧 공개 예정입니다!';
        const href = isLocked ? '#locked' : (g.href || `./${encodeURIComponent(g.id)}/`);
        const p = popMap[g.id];
        const bestTxt = isLocked ? '공개 대기 중' : stripPictographs(formatBestText(g.id, p && p.topRun));
        const numTxt = `#${String(idx + 1).padStart(2, '0')}`;
        const cleanBadge = stripPictographs(g.badge) || '아케이드';
        const primaryMetrics = p
          ? `${formatPlayCount(p)} · ${stripPictographs(p.playTimeLabel)}`
          : '게임 실행 수 집계 중';

        return `
          <a class="ledger-row ${isLocked ? 'is-locked' : ''}" href="${esc(href)}" data-game-id="${esc(g.id)}" data-locked="${isLocked ? '1' : '0'}" data-lock-msg="${esc(lockMsg)}">
            <div class="ledger-num">${numTxt}</div>
            <div class="ledger-thumb">
              <img src="${esc(g.thumb_url || `./assets/thumb-${g.id}.jpg`)}" alt="${esc(g.title)}">
            </div>
            <div class="ledger-main">
              <div class="ledger-title-line">
                <h3 class="ledger-title">${esc(g.title)}</h3>
                ${isNew ? `<span class="ledger-tag is-new">신작</span>` : ''}
                <span class="ledger-tag">${esc(cleanBadge)}</span>
              </div>
              <p class="ledger-desc">${esc(isLocked ? lockMsg : (g.description || ''))}</p>
            </div>
            <div class="ledger-metrics">
              <span class="ledger-m-primary">${esc(primaryMetrics)}</span>
              <span class="ledger-m-best">${esc(bestTxt)}</span>
            </div>
            <span class="ledger-play-btn">${playIconSvg}<span>${isLocked ? '대기' : '실행'}</span></span>
          </a>
        `;
      }).join('');

      bindLockedClicks(masterDeck);
      bindLockedClicks(trayWells);
      bindLockedClicks(ledgerList);
    }

    document.querySelectorAll('#sort-tabs .sort-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#sort-tabs .sort-chip').forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        ledgerSort = btn.dataset.sort || 'custom';
        renderGames();
      });
    });

    async function refreshHub() {
      try {
        const [pop, layout] = await Promise.all([
          computeGamesPopularity(currentGames),
          loadLayoutConfig(true),
        ]);
        popMap = pop;
        newIdSet = new Set(layout.newIds || ['snap', 'jjamppong', 'boxcut']);
        renderGames();

        const { games } = await fetchPublicCatalog();
        currentGames = games;
        popMap = await computeGamesPopularity(currentGames);
        renderGames();
      } catch {
        // 오프라인 시 초기 실측 카탈로그 유지
      }
    }

    renderGames();
    refreshHub();
  </script>
</body>
</html>
